services:
  postgres:
    image: postgres:16-alpine
    container_name: barberos-postgres
    environment:
      POSTGRES_DB: barberos
      POSTGRES_USER: barberos
      POSTGRES_PASSWORD: barberos123
    ports:
      - "5432:5432"
    volumes:
      - barberos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  barberos-data:
