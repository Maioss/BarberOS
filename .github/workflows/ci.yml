name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore BarberOS.slnx

      - name: Compilar
        run: dotnet build BarberOS.slnx --no-restore --configuration Release

      - name: Pruebas de dominio
        run: dotnet test BarberOS.Domain.Tests --no-build --configuration Release --verbosity quiet

      # Los tests de integracion levantan Postgres con Testcontainers y necesitan
      # el Docker del runner.
      - name: Pruebas de integracion
        run: dotnet test BarberOS.Api.IntegrationTests --no-build --configuration Release --verbosity quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build
